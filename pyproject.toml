[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qt-extensions"
version = "0.1.1"
description = "A lightweight collection of utility extensions, type-safe signals, and custom widgets for PySide6."
readme = "README.MD"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Alan" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "typing-extensions>=4.0.0",
    "pyside6"
]

[project.urls]
Homepage = "https://github.com/alan871125/Qt-Extensions"
Repository = "https://github.com/alan871125/Qt-Extensions"

[tool.setuptools.packages.find]
where = ["src"]
